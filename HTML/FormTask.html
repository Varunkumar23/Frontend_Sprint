<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Form</title>

<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f5f5f5;
}

.container {
    background: grey;
    padding: 20px 30px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    width: 420px;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

.form-group {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
}

.form-group label {
    width: 140px;
    font-weight: bold;
}

.form-group input,
.form-group select {
    flex: 1;
    padding: 5px;
}

.inline-options {
    gap: 2px;
}

.buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
}

button {
    padding: 8px 15px;
    border: none;
    background-color: black;
    color: white;
    cursor: pointer;
    border-radius: 4px;
}

button:hover {
    background-color: #333;
}
</style>

</head>
<body>

<div class="container">
    <h2>Application Form</h2>

    <form>

        <div class="form-group">
            <label for="name">Name*</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address">
        </div>

        <div class="form-group">
            <label for="zipcode">Zip Code*</label>
            <input type="text" id="zipcode" placeholder="5-digit code" required>
        </div>

        <div class="form-group">
            <label for="country">Country*</label>
            <select id="country" required>
                <option>India</option>
                <option>Russia</option>
                <option>Afghanistan</option>
                <option>USA</option>
                <option>Japan</option>
            </select>
        </div>

        <div class="form-group">
            <label>Gender*</label>
            <div class="inline-options">
                <label><input type="radio" name="gender"> Male</label>
                <label><input type="radio" name="gender"> Female</label>
            </div>
        </div>

        <div class="form-group">
            <label>Preferences*</label>
            <div class="inline-options">
                <label><input type="checkbox"> Red</label>
                <label><input type="checkbox"> Green</label>
                <label><input type="checkbox"> Blue</label>
            </div>
        </div>

        <div class="form-group">
            <label for="phone">Phone*</label>
            <input type="tel" id="phone" maxlength="10" required>
        </div>

        <div class="form-group">
            <label for="email">Email*</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label for="password">Password*</label>
            <input type="password" id="password" required>
        </div>

        <div class="form-group">
            <label for="vpassword">Verify Password*</label>
            <input type="password" id="vpassword" required>
        </div>

        <div class="form-group">
            <label for="bday">Birthday*</label>
            <input type="date" id="bday" required>
        </div>

        <div class="form-group">
            <label for="appointment">Appintment*</label>
            <input type="time" id="appointment" required>
        </div>

        <div class="buttons">
            <button type="submit">SEND</button>
            <button type="reset">CLEAR</button>
        </div>

    </form>
</div>

</body>
</html>
