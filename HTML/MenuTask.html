    <!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Mania</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eee;
      margin: 0;
    }

    .header {
      background-color: yellow;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 20px;
    }

    .container {
      padding: 20px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: inline-block;
      width: 180px;
      margin: 10px 0;
    }

    input, select, textarea {
      padding: 5px;
      margin: 5px 0;
    }

    .menu-item {
      display: flex;
      align-items: center;
      margin: 15px 0;
    }

    .menu-item img {
      width: 80px;
      margin-right: 20px;
    }

    .highlight {
      background-color: yellow;
      font-weight: bold;
      padding: 2px 5px;
    }

    .extra-section {
      margin-top: 30px;
    }

    .submit-btn {
      margin-top: 20px;
      padding: 8px 15px;
    }
  </style>

</head>

<body>

  <div class="header">🍕 Pizza mania</div>

  <div class="container">


<h2>🍕 Pizza Order Here</h2>

<form>

  <label>First Name:</label>
  <input type="text" placeholder="First Name"><br>

  <label>Last Name:</label>
  <input type="text" placeholder="Last Name"><br>

  <label>Email:</label>
  <input type="email" placeholder="abc@example.com"><br>

  <label>Contact:</label>
  <input type="text" placeholder="Ex-989898989"><br>

  <label>Preferred Delivery Date:</label>
  <input type="date"><br>

  <label>Size:</label>
  <input type="radio" name="size"> Small
  <input type="radio" name="size"> Medium
  <input type="radio" name="size"> Large
  <br><br>

  <label class="highlight">Outlet:</label>
  <select>
    <option>Select Outlet</option>
    <option>Hyderabad</option>
    <option>Bangalore</option>
  </select>

  <h3>Menu ↓</h3>

  <div class="menu-item">
    <img src="https://www.bowlofdelicious.com/wp-content/uploads/2020/01/Hawaiian-Pizza-3.jpg">
    <input type="checkbox"> Hawaiian (150 ₹ <s>170.00₹</s>)
    <select>
      <option>1</option>
      <option>2</option>
    </select>
  </div>

  <div class="menu-item">
    <img src="https://www.tablefortwoblog.com/wp-content/uploads/2025/06/pepperoni-pizza-recipe-photos-tablefortwoblog-6.jpg">
    <input type="checkbox"> Pepperoni (140 ₹ <s>160.00₹</s>)
    <select>
      <option>1</option>
      <option>2</option>
    </select>
  </div>

  <div class="menu-item">
    <img src="https://aplantifulpath.com/wp-content/uploads/2024/07/vegan-vegetable-pizza-square.jpg">
    <input type="checkbox"> Vegetable (130 ₹ <s>150.00₹</s>)
    <select>
      <option>1</option>
      <option>2</option>
    </select>
  </div>

  <div class="extra-section">
    <h3>Extra Details ↓</h3>

    <label>Credit Card:</label>
    <input type="text" placeholder="1234-5678-9123-1111">
    <button type="button">Verify Card</button><br>

    <label>Pin:</label>
    <input type="password" placeholder="421604"><br>

    <label class="highlight">Upload photo for discount:</label>
    <input type="file"><br>

    <label class="highlight">Additional Note:</label>
    <textarea rows="4" cols="30"></textarea><br>

    <label class="highlight">Rating:</label>
    <input type="range"><br>

    <button class="submit-btn">Submit Order</button>
  </div>

</form>

  </div>

</body>
</html>

</body>
</html>
