<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
font-family: Arial, sans-serif;
background-color: grey;
color: white;
text-align: center;
}

/* Table Container */
table {
margin: 40px auto;
border-collapse: collapse;
background-color: #181818;
border-radius: 10px;
overflow: hidden;
width: 70%;
}

/* Header */
th {
font-size: 28px;
padding: 20px;
background-color: #1DB954;
color: black;
letter-spacing: 1px;
}

/* Table Cells */
td {
padding: 15px;
border-bottom: 1px solid #333;
}

/* Row Hover Effect */
tr:hover {
background-color: #282828;
cursor: pointer;
}

/* Images */
img {
height: 150px;
width: 200px;
border-radius: 8px;
transition: transform 0.3s ease;
}

/* Image Hover Zoom */
img:hover {
transform: scale(1.05);
}

/* Audio Player */
audio {
width: 200px;
filter: invert(1);
}

/* Optional Song Text */
p {
margin: 5px 0;
font-weight: bold;
color: #1DB954;
}
</style>
</head>
<body>
    <table>

    </tr>
